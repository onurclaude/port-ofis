server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portofis}
    username: ${SPRING_DATASOURCE_USERNAME:portofis}
    password: ${SPRING_DATASOURCE_PASSWORD:portofis}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

admin:
  jwt:
    secret: ${ADMIN_JWT_SECRET}
    expiration-hours: 12
  default:
    username: ${ADMIN_DEFAULT_USERNAME:}
    password: ${ADMIN_DEFAULT_PASSWORD:}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
